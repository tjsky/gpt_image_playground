server {
    listen ${HOST}:${PORT};
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 600m;
    client_body_buffer_size 100m;
    add_header Referrer-Policy "unsafe-url" always;

    # gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml font/ttf;
    gzip_min_length 256;

    # 静态资源长缓存（Vite 生成的带 hash 文件名）
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";

        # nginx 自带的 mime.types 没有 ttf（会按 application/octet-stream 返回），补上类型以便 gzip 压缩本地字体
        location ~* \.ttf$ {
            types { font/ttf ttf; }
        }
    }

    # BEGIN API PROXY
    # 站点 API 代理（双层脱敏）：
    #   1. 校验前端持有的「假 KEY」，不匹配直接 401，假 KEY 泄露也无价值；
    #   2. 由 /etc/nginx/relay/api-target.conf 注入「真 KEY」并指定真实上游，该文件由管理员维护或由环境变量生成；
    #   3. 路径白名单只放行图片生成/编辑、responses 与异步任务查询，堵死 chat、embeddings 等白嫖路径。
    location /api-proxy/ {
        limit_except GET POST OPTIONS {
            deny all;
        }

        # BEGIN KEY CHECK
        if ($http_authorization != "Bearer ${DEFAULT_API_KEY}") {
            return 401 "Unauthorized: Invalid Proxy Key";
        }
        # END KEY CHECK

        # GET/HEAD 仅允许异步任务查询（含 images/tasks/{id} 与 tasks/{id}），其余接口必须 POST
        set $api_proxy_request "$request_method:$uri";
        if ($api_proxy_request ~ "^(GET|HEAD):/api-proxy/(?!((v1/)?images/tasks/|tasks/)[A-Za-z0-9_.-]+$)") {
            return 403 "Forbidden: API Proxy task query required";
        }

        if ($uri = "/api-proxy/") {
            return 403 "Forbidden: API Proxy path required";
        }

        # 路径白名单：与前端实际调用保持一致（同步生图、异步任务提交与轮询、responses）
        set $api_proxy_allowed 0;
        if ($uri ~* "^/api-proxy/((v1/)?(images/(generations|edits|tasks/[A-Za-z0-9_.-]+)|responses)|tasks/[A-Za-z0-9_.-]+)$") {
            set $api_proxy_allowed 1;
        }
        if ($api_proxy_allowed = 0) {
            return 403 "Forbidden: API Proxy path restricted";
        }

        # 限流（zone 见 deploy/00-api-proxy-zone.conf）
        limit_req zone=api_proxy burst=30 delay=20;

        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name $proxy_host;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 不把本站 Cookie 带给上游中转站
        proxy_set_header Cookie "";
        proxy_set_header Connection "";
        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        proxy_buffering off;
        proxy_request_buffering off;

        # 真实上游地址 + 真实 KEY（管理员挂载，或用 API_PROXY_URL / API_PROXY_KEY 生成）
        include /etc/nginx/relay/api-target.conf;
    }
    # END API PROXY

    # BEGIN IMAGE PROXY
    # 图片下载中转：绕开中转站返回 URL 时的浏览器跨域限制
    # 目标 URL 优先取请求头 X-Image-URL（前端 fetch 使用，不受查询串的 & 与百分号编码影响），
    # 兼容旧的 ?url=（注意 Nginx 不解码查询串，带 & 的签名 URL 会被截断）
    location /image-proxy/ {
        set $image_target $http_x_image_url;
        if ($image_target = "") {
            set $image_target $arg_url;
        }

        if ($image_target = "") {
            return 400 "Missing image url";
        }

        # 只允许 https，并拦截环回/内网地址（防 SSRF；严格白名单见 relay/image-allow.conf）
        if ($image_target !~* "^https://") {
            return 403 "Only https url allowed";
        }
        if ($image_target ~* "^https://(localhost|[0-9.]+|\[[0-9a-f:]+\])([:/?#]|$)") {
            return 403 "Host not allowed";
        }
        if ($image_target ~* "^https://(127\.|0\.|10\.|192\.168\.|169\.254\.|172\.(1[6-9]|2[0-9]|3[01])\.)") {
            return 403 "Host not allowed";
        }

        # 可选：严格域名白名单（管理员挂载，或用 IMAGE_PROXY_ALLOW_HOSTS 生成）
        include /etc/nginx/relay/image-allow.conf;

        resolver 127.0.0.11 8.8.8.8 1.1.1.1 valid=300s ipv6=off;
        proxy_pass $image_target;
        proxy_ssl_server_name on;
        proxy_set_header Host $proxy_host;
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_set_header Referer "";
        proxy_connect_timeout 60s;
        proxy_read_timeout 600s;
    }
    # END IMAGE PROXY

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
